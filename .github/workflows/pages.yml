name: Deploy to GitHub Pages

# Publishes the backend-less demo of the React app (frontend/, built with `npm run build:demo`) at the
# site root, plus frontend/pages-site/ (demo/ redirects old /demo/ links to the root, keeping the hash).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the demo
        working-directory: frontend
        run: npm run build:demo

      - name: Assemble the site (demo + redirect from demo/)
        run: |
          mkdir -p _site
          cp -R frontend/dist-demo/. _site/
          cp -R frontend/pages-site/. _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
