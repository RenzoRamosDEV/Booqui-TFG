<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('booqi-theme')
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <title>Booqi</title>
    <meta
      name="description"
      content="Booqi: descubre eventos y reserva tus entradas en segundos."
    />
    <meta name="theme-color" content="#7C3AED" />
    <link rel="icon" type="image/png" href="/BOOQI2.png" />
    <link rel="apple-touch-icon" href="/BOOQI2.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Booqi" />
    <meta property="og:title" content="Booqi" />
    <meta
      property="og:description"
      content="Descubre eventos y reserva tus entradas en segundos."
    />
    <meta property="og:image" content="/BOOQI2.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
