name: booqi

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - booqi-network

x-service-healthcheck: &service-healthcheck
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 40s

services:
  booqi-mysql:
    <<: *service-defaults
    image: mysql:8.0
    container_name: booqi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      BOOQI_DB_USER: ${BOOQI_DB_USER:?BOOQI_DB_USER is required}
      BOOQI_DB_PASSWORD: ${BOOQI_DB_PASSWORD:?BOOQI_DB_PASSWORD is required}
    ports:
      - "3307:3306"
    volumes:
      - ../db/init/001_init_database.sql:/docker-entrypoint-initdb.d/001_init_database.sql:ro,z
      - ../db/init/002_create_app_user.sh:/docker-entrypoint-initdb.d/002_create_app_user.sh:ro,z
      - booqi-mysql-data:/var/lib/mysql
    # TCP ping: the init-time server runs with --skip-networking, so it stays unhealthy until init scripts finish.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  booqi-user-service:
    <<: *service-defaults
    build:
      context: ../../services/user-service
      dockerfile: Dockerfile
    image: booqi/user-service:${BOOQI_TAG:-latest}
    container_name: booqi-user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://booqi-mysql:3306/user
      SPRING_DATASOURCE_USERNAME: ${BOOQI_DB_USER:?BOOQI_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${BOOQI_DB_PASSWORD:?BOOQI_DB_PASSWORD is required}
      BOOQI_CORS_ALLOWED_ORIGINS: ${BOOQI_CORS_ALLOWED_ORIGINS:?BOOQI_CORS_ALLOWED_ORIGINS is required}
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
    depends_on:
      booqi-mysql:
        condition: service_healthy

  booqi-event-service:
    <<: *service-defaults
    build:
      context: ../../services/event-service
      dockerfile: Dockerfile
    image: booqi/event-service:${BOOQI_TAG:-latest}
    container_name: booqi-event-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://booqi-mysql:3306/event
      SPRING_DATASOURCE_USERNAME: ${BOOQI_DB_USER:?BOOQI_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${BOOQI_DB_PASSWORD:?BOOQI_DB_PASSWORD is required}
      BOOQI_CORS_ALLOWED_ORIGINS: ${BOOQI_CORS_ALLOWED_ORIGINS:?BOOQI_CORS_ALLOWED_ORIGINS is required}
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
    depends_on:
      booqi-mysql:
        condition: service_healthy

  booqi-booking-service:
    <<: *service-defaults
    build:
      context: ../../services/booking-service
      dockerfile: Dockerfile
    image: booqi/booking-service:${BOOQI_TAG:-latest}
    container_name: booqi-booking-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://booqi-mysql:3306/booking
      SPRING_DATASOURCE_USERNAME: ${BOOQI_DB_USER:?BOOQI_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${BOOQI_DB_PASSWORD:?BOOQI_DB_PASSWORD is required}
      BOOQI_CORS_ALLOWED_ORIGINS: ${BOOQI_CORS_ALLOWED_ORIGINS:?BOOQI_CORS_ALLOWED_ORIGINS is required}
      BOOQI_USER_SERVICE_URL: http://booqi-user-service:8080
      BOOQI_EVENT_SERVICE_URL: http://booqi-event-service:8081
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
    depends_on:
      booqi-mysql:
        condition: service_healthy
      booqi-user-service:
        condition: service_healthy
      booqi-event-service:
        condition: service_healthy

  booqi-payment-service:
    <<: *service-defaults
    build:
      context: ../../services/payment-service
      dockerfile: Dockerfile
    image: booqi/payment-service:${BOOQI_TAG:-latest}
    container_name: booqi-payment-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://booqi-mysql:3306/payment
      SPRING_DATASOURCE_USERNAME: ${BOOQI_DB_USER:?BOOQI_DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${BOOQI_DB_PASSWORD:?BOOQI_DB_PASSWORD is required}
      BOOQI_CORS_ALLOWED_ORIGINS: ${BOOQI_CORS_ALLOWED_ORIGINS:?BOOQI_CORS_ALLOWED_ORIGINS is required}
      BOOQI_EVENT_SERVICE_URL: http://booqi-event-service:8081
      BOOQI_BOOKING_SERVICE_URL: http://booqi-booking-service:8082
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
    depends_on:
      booqi-mysql:
        condition: service_healthy
      booqi-booking-service:
        condition: service_healthy
      booqi-event-service:
        condition: service_healthy

  booqi-frontend:
    <<: *service-defaults
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: booqi/frontend:${BOOQI_TAG:-latest}
    container_name: booqi-frontend
    ports:
      - "${BOOQI_FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      booqi-user-service:
        condition: service_healthy
      booqi-event-service:
        condition: service_healthy
      booqi-booking-service:
        condition: service_healthy
      booqi-payment-service:
        condition: service_healthy

networks:
  booqi-network:
    name: booqi-network
    driver: bridge

volumes:
  booqi-mysql-data:
    name: booqi-mysql-data
