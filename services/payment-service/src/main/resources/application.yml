spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/payment}
    username: ${SPRING_DATASOURCE_USERNAME:booqi}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

booqi:
  cors:
    allowed-origins: ${BOOQI_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  clients:
    event:
      base-url: ${BOOQI_EVENT_SERVICE_URL:http://localhost:8081}
    booking:
      base-url: ${BOOQI_BOOKING_SERVICE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
